<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Écris ton histoire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Écris ton histoire</h1>
  <p class="intro">Saisis ton nom et ton histoire, puis envoie-les au maître du jeu.</p>

  <form id="formulaire" autocomplete="off">
    <label for="nom">Ton nom</label>
    <input id="nom" name="nom" type="text" maxlength="60" required>

    <label for="histoire">Ton histoire</label>
    <textarea id="histoire" name="histoire" rows="12" maxlength="5000" required></textarea>
    <div class="compteur"><span id="compte">0</span> / 5000 caractères</div>

    <!-- champ piège anti-robots (doit rester vide) -->
    <input type="checkbox" name="botcheck" class="piege" tabindex="-1" autocomplete="off">

    <button type="submit" id="envoyer">Envoyer mon histoire</button>
    <p id="message" role="status"></p>
  </form>
</main>
<script>window.JOUEUR = 3;</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
